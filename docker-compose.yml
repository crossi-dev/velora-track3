services:
  db:
    image: postgres:16-alpine
    container_name: velora-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-velora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - velora-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velora-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password123}@db:5432/${DB_NAME:-velora}?schema=public
      # ... otras env vars (AUTH_SECRET, etc)
    depends_on:
      - db
    networks:
      - velora-network

networks:
  velora-network:
    driver: bridge

volumes:
  postgres_data:
